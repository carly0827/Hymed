<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>생성 완료</title>
  <style>

    .card{border:1px solid #ddd;border-radius:12px;padding:20px}

</head>
<body>

    <p>아래에서 결과 파일과 검증 리포트를 받을 수 있어요.</p>
    <p>
      <a class="btn" href="{{ download_url }}">주석 PDF 다운로드</a>
    </p>
    <a class="link" href="{{ precheck_url }}">사전 검증 리포트 다운로드</a>
    <a class="link" href="{{ finalcheck_url }}">최종 검증 리포트 다운로드</a>
    <p><a class="link" href="/">다시 만들기</a></p>
  </div>

</html>
